<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="refresh" content="30" />
		<meta name="robots" content="noindex" />
		<title>TF2DLE</title>
		<style>
			:root {
				color-scheme: dark;
				--background: hsl(20 14.3% 4.1%);
				--foreground: hsl(60 9.1% 97.8%);
				--primary: hsl(20.5 90.2% 48.2%);
				--secondary: hsl(12 6.5% 15.1%);
				--muted-foreground: hsl(24 5.4% 63.9%);
				--border: hsl(12 6.5% 15.1%);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
			}

			body {
				min-height: 100vh;
				background:
					radial-gradient(circle at top, hsl(20 90% 18% / 0.42), transparent 32rem),
					linear-gradient(rgba(0 0 0 / 0.55), rgba(0 0 0 / 1)), var(--background);
				color: var(--foreground);
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
			}

			.page {
				display: flex;
				min-height: 100vh;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 2rem;
				padding: 3.5rem 0.5rem 2.5rem;
			}

			.logo {
				display: block;
				width: min(20rem, 86vw);
				height: auto;
			}

			.maintenance {
				width: min(100%, 700px);
				display: grid;
				gap: 1.25rem;
			}

			.content {
				display: grid;
				grid-template-columns: 1fr 150px;
				align-items: end;
				gap: 1.25rem;
			}

			h1 {
				margin: 0;
				font-size: 0.8rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				line-height: 1rem;
				text-transform: uppercase;
				color: var(--primary);
			}

			.button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				margin-top: 1.5rem;
				border-radius: 0.5rem;
				background: var(--secondary);
				padding: 0.65rem 1rem;
				color: var(--foreground);
				font-size: 0.875rem;
				font-weight: 600;
				text-decoration: none;
			}

			.button:hover {
				background: color-mix(in srgb, var(--secondary) 82%, var(--primary));
			}

			.engineer {
				display: block;
				grid-column: 2;
				grid-row: 1;
				width: 150px;
				height: auto;
			}

			.speech {
				position: relative;
				grid-column: 1;
				grid-row: 1;
				border: 1px solid var(--border);
				border-radius: 0.5rem;
				background: var(--secondary);
				padding: 1rem;
			}

			.speech::before {
				position: absolute;
				bottom: 28px;
				right: -10px;
				width: 18px;
				height: 18px;
				border-bottom: 1px solid var(--border);
				border-right: 1px solid var(--border);
				content: '';
				background: var(--secondary);
				transform: rotate(-45deg);
			}

			.speech .lede {
				position: relative;
				margin: 0;
				margin-top: 0.5rem;
				font-size: 1.35rem;
				font-weight: 700;
				line-height: 1.25;
			}

			.speech .note {
				position: relative;
				margin-top: 0.75rem;
				margin-bottom: 0;
				color: var(--muted-foreground);
				line-height: 1.6;
			}

			@media (max-width: 560px) {
				.content {
					grid-template-columns: 1fr 112px;
					gap: 0.75rem;
				}

				.engineer {
					width: 112px;
				}
			}
		</style>
	</head>
