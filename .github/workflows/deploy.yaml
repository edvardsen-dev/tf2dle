name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing GHCR version tag, including v if present (not latest)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-shared.yaml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
