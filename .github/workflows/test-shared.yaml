name: Shared Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scraper-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.4'
          python-version: '3.12'

      - name: Install locked dependencies
        working-directory: scripts
        run: uv sync --locked

      - name: Run offline scraper and updater tests
        working-directory: scripts
        run: uv run --locked python -m unittest discover -s tests -v

  unit-test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_APP_VERSION: test
      PUBLIC_CDN_URL: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:client
        env:
          DATABASE_URL: postgresql://tf2dle_test:tf2dle_test@127.0.0.1:5432/tf2dle_migration_test

      - name: Check types and Svelte diagnostics
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

  integration-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tf2dle_test:tf2dle_test@127.0.0.1:5432/tf2dle_migration_test
      ADMIN_PASSWORD: migration-test-password
      CRON_SECRET: migration-test-secret
      PUBLIC_APP_VERSION: test
      PUBLIC_CDN_URL: ''

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: tf2dle_test
          POSTGRES_PASSWORD: tf2dle_test
          POSTGRES_DB: tf2dle_migration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:client

      - name: Apply Prisma migrations
        run: pnpm db:migrate

      - name: Build production application
        run: pnpm build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser dependencies
        run: pnpm exec playwright install-deps

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install

      - name: Run integration tests
        run: pnpm test:integration

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
